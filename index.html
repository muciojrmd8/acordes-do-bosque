<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasmim da Noite - Acordes do Bosque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0c0f;
            color: #f0f0f0;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }
        .font-display {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>
<body class="antialiased">
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full text-center">
            
            <img src="images/jasmim-da-noite-label.jpg" 
                 alt="Rótulo do produto Jasmim da Noite, com flores de jasmim, uma lua crescente e detalhes dourados sobre um fundo azul escuro." 
                 class="mx-auto mb-8 rounded-2xl shadow-2xl shadow-black/60 w-full max-w-sm">

            <h1 class="font-display text-5xl font-bold mb-2 text-amber-50">Jasmim da Noite</h1>
            
            <p class="text-gray-400 mb-8 max-w-sm mx-auto">
                Uma fragrância que captura a alma de um jardim secreto ao luar. Deixe o mistério e a elegância florescerem no seu espaço.
            </p>
            
            <a href="#" class="inline-block bg-amber-50 text-black font-bold py-3 px-10 rounded-full hover:bg-amber-100 transition-colors duration-300 shadow-lg shadow-amber-50/10">
                Adquirir
            </a>

        </div>
    </div>
</body>
</html>
