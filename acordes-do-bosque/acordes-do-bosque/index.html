        .hero-bg { background-image: linear-gradient(rgba(13, 12, 15, 0.7), rgba(13, 12, 15, 1)), url('https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?q=80&w=2000'); background-size: cover; background-position: center; }

<body class="antialiased">

    <header class="p-4 md:p-6 sticky top-0 bg-black/30 backdrop-blur-sm z-10">
